services:
  yamcs:
    container_name: yamcs
    build:
      context: .
      dockerfile: yamcs/dockerfile
    ports:
      - '${MY_IP}:8090:8090'

  grafana:
    container_name: grafana
    build:
      context: .
      dockerfile: grafana/dockerfile
    restart: unless-stopped
    ports:
      - '${MY_IP}:3000:3000'
    environment:
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=yamcs-yamcs-datasource

